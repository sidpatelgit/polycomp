[project]
name = "polycomp"
version = "0.1.0"
description = "Reproducible BlockSplit benchmark assets, payloads, and results"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pillow>=11.0,<12",
]

[project.scripts]
polycomp = "polycomp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff==0.16.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/polycomp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
